name: Apple SwiftData behavior validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  swiftdata-behavior-validation:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate behavior against system SwiftData
        run: swift test -v
        working-directory: AppleSwiftDataBehaviorValidation
