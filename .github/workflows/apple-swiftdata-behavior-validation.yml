name: Apple SwiftData behavior validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  swiftdata-behavior-validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show selected Apple toolchain
        run: swift --version
      - name: Validate Apple SwiftData snapshot behavior
        run: swift test
        working-directory: AppleSwiftDataBehaviorValidation
