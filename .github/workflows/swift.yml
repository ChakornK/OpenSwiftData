name: Swift build and test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  swift:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
