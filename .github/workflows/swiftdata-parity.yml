name: SwiftData behavior parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compare-swiftdata-behavior:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Record Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Test Apple parity tools
        run: swift test --package-path Tests/SwiftDataParity/AppleRunner
      - name: Run OpenSwiftData parity scenarios
        run: swift run --package-path Tests/SwiftDataParity/OSDRunner osd-parity-runner --output /tmp/osd-observations.json
      - name: Run Apple SwiftData parity scenarios
        run: swift run --package-path Tests/SwiftDataParity/AppleRunner apple-parity-runner --output /tmp/apple-observations.json
      - name: Validate source coverage
        if: always()
        run: swift run --package-path Tests/SwiftDataParity/AppleRunner parity-validate
      - name: Validate API surface coverage
        if: always()
        run: swift run --package-path Tests/SwiftDataParity/AppleRunner parity-api-coverage --sdk "$(xcrun --show-sdk-path)"
      - name: Compare scenario observations
        run: swift run --package-path Tests/SwiftDataParity/AppleRunner parity-compare --osd /tmp/osd-observations.json --apple /tmp/apple-observations.json --allowlist Tests/SwiftDataParity/parity-allowlist.json --matrix Tests/SwiftDataParity/parity-matrix.json --coverage-report parity-coverage-report.json --report /tmp/parity-diff.json
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftdata-parity-${{ github.sha }}
          path: |
            /tmp/osd-observations.json
            /tmp/apple-observations.json
            /tmp/parity-diff.json
            parity-coverage-report.json
            parity-api-coverage-report.json
          if-no-files-found: warn
